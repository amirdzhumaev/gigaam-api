[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gigaam-api"
version = "0.1.0"
description = "Independent asynchronous Russian speech recognition service"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "alembic>=1.14,<2","fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
worker = ["onnx-asr[cpu,hub]==0.12.0"]
test = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E712"]
